volumes:
  prometheus-volume:
services:
  app:
    build: .
    hostname: group2_killswitch_app
    networks:
      appnet:
        aliases:
          - group2_killswitch_app
    ports:
      - "2225:22"
      - "10234:7860"
      - "9100:9100"
      - "8000:8000"
    volumes:
      - prometheus-volume:/prometheus
      - ./Prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
  spy:
    build: spy/
    hostname: spy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      appnet:
        aliases:
          - spy
    ports:
      - "2222:22"
    restart: unless-stopped
  prometheus:
    build: Prometheus/
    hostname: prometheus
    networks:
      appnet:
        aliases:
          - prometheus
    ports:
      - "2223:22"
      - "9090:9090"
    restart: unless-stopped
  grafana:
    build: Grafana/
    hostname: grafana
    networks:
      appnet:
        aliases:
          - grafana
    ports:
      - "2224:22"
      - "3000:3000"
    restart: unless-stopped

networks:
  appnet:

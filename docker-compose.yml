volumes:
  prometheus-volume:
services:
  group2_killswitch_app:
    build: .
    hostname: group2_killswitch_app
    networks:
      appnet:
        aliases:
          - group2_killswitch_app
    ports:
      - "1800:22"
      - "1801:7860"
      - "1802:9100"
      - "1803:8000"
    restart: unless-stopped
  group2_spy:
    build: spy/
    networks:
      appnet:
        aliases:
          - group2_spy
    ports:
      - "1804:22"
    restart: unless-stopped
  group2_prometheus:
    build: Prometheus/
    volumes:
      - prometheus-volume:/prometheus
      - ./Prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "1805:22"
      - "1806:9090"
    restart: unless-stopped
  group2_grafana:
    build: Grafana/
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "1807:22"
      - "1808:3000"
    restart: unless-stopped
  group2_ngrok:
    image: ngrok/ngrok:latest
    command: http app:7860 --url https://exorcism-refill-sincerity.ngrok-free.dev
    environment:
      NGROK_AUTHTOKEN: ${NGROK_TOKEN}
    depends_on:
      - app
    networks:
      - appnet
    ports:
      - "1809:4040"   # optional: ngrok's web inspector
    restart: unless-stopped

networks:
  appnet:
